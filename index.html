<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ширма</title>
  <link rel="stylesheet" href="css/app.css?v=12">
</head>
<body>
  <section id="gate" class="gate">
    <div class="card">
      <h1>Ширма</h1>
      <p id="gate-text">Мастер собирает сцены. Игрок и окно Share видят только картинку.</p>
      <div id="choices" class="choices">
        <button class="primary" id="enter-master" type="button">Мастер</button>
        <button id="enter-player" type="button">Игрок</button>
      </div>
      <form id="auth" class="hidden">
        <label><span id="password-label">Пароль</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <label id="confirm-label" class="hidden">Ещё раз
          <input id="confirm" type="password" autocomplete="new-password">
        </label>
        <div class="row">
          <button class="primary" type="submit">Войти</button>
          <button id="auth-back" type="button">Назад</button>
        </div>
        <p id="auth-error" class="error"></p>
      </form>
    </div>
  </section>

  <section id="editor" class="editor hidden">
    <div class="topbar">
      <select id="pages" aria-label="Страница"></select>
      <select id="page-kind" aria-label="Тип сцены">
        <option value="free">Холст</option>
        <option value="talk">НПС</option>
        <option value="initiative">Бой</option>
        <option value="codex">Справочник</option>
      </select>
      <button id="page-add" type="button" title="Новая страница">+</button>
      <button id="show-scene" type="button">Сменить сцену</button>
      <button id="page-rename" type="button">Имя</button>
      <button id="page-delete" class="danger" type="button">Удалить</button>
      <div class="size">
        <input id="stage-w" type="number" min="320" max="3840" aria-label="Ширина">
        ×
        <input id="stage-h" type="number" min="240" max="2160" aria-label="Высота">
      </div>
      <span class="spacer"></span>
      <button id="roll-d20" type="button" title="Бросок d20" aria-label="Бросок d20"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3l8 4.8v8.4L12 21l-8-4.8V7.8z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button id="share" class="primary" type="button">Share</button>
      <button id="export-json" type="button">JSON</button>
      <button id="export-zip" type="button">ZIP</button>
      <button id="import-file" type="button">Открыть</button>
      <input id="import-input" type="file" accept="application/json,.json,application/zip,.zip" class="hidden">
      <button id="logout" type="button">Выйти</button>
    </div>
    <div id="gjs" class="hidden"></div>
    <div id="paint" class="paint hidden">
      <div class="paint-tools">
        <button type="button" data-paint-tool="brush" class="is-on">Кисть</button>
        <button type="button" data-paint-tool="select" title="Клик выбирает картинку, фигуру или линию. Тяните, чтобы сдвинуть. Угол меняет размер, Shift сохраняет пропорции">Выбор</button>
        <button type="button" data-paint-tool="eraser">Ластик</button>
        <button type="button" data-paint-tool="line" title="С Shift линия ложится по диагонали">Линия</button>
        <button type="button" data-paint-tool="rect" title="С Shift получается квадрат">Прямоугольник</button>
        <button type="button" data-paint-tool="ellipse" title="С Shift получается круг">Эллипс</button>
        <label class="paint-size">Линия <input id="paint-color" type="color" value="#f3ead8" aria-label="Цвет линии"></label>
        <label class="paint-size">Фигура <input id="paint-fill-color" type="color" value="#c45a4a" aria-label="Цвет заливки"></label>
        <label class="paint-size">Толщина <input id="paint-size" type="range" min="1" max="80" value="8"></label>
        <label class="paint-fill"><input id="paint-fill" type="checkbox"> Заливка</label>
        <button type="button" id="paint-image" title="Выберите файл и протяните рамку на холсте">Картинка</button>
        <input id="paint-image-file" type="file" accept="image/*" class="hidden">
        <button type="button" id="paint-undo" title="Ctrl+Z">Назад</button>
        <button type="button" id="paint-clear">Очистить слой</button>
        <button type="button" id="paint-download">Скачать холст</button>
      </div>
      <div class="paint-body">
        <div class="paint-stage"><canvas id="paint-canvas"></canvas></div>
        <aside class="paint-layers">
          <div class="paint-layer-bar">
            <button type="button" id="layer-add" title="Новый слой">+</button>
            <button type="button" id="layer-up" title="Выше">Выше</button>
            <button type="button" id="layer-down" title="Ниже">Ниже</button>
            <button type="button" id="layer-delete" title="Удалить слой">×</button>
          </div>
          <div id="paint-layer-list"></div>
        </aside>
      </div>
    </div>
    <div id="scene-editor" class="scene-editor hidden"></div>
    <div id="codex" class="codex hidden"></div>
    <div id="pop" class="pop hidden"></div>
  </section>

  <section id="stage-view" class="stage-view hidden">
    <div id="stage-fit">
      <iframe id="frame" title="Экран ширмы"></iframe>
      <div id="scene-play" class="hidden"></div>
      <canvas id="die"></canvas>
      <div id="float"></div>
    </div>
  </section>

  <script src="vendor/jszip.min.js"></script>
  <script src="js/library.js"></script>
  <script src="js/ru.js"></script>
  <script src="js/names.js"></script>
  <script src="js/monster-img.js"></script>
  <script src="js/shoppool.js"></script>
  <script src="js/store.js"></script>
  <script src="js/live.js"></script>
  <script src="js/scenes.js?v=16"></script>
  <script src="js/dice.js?v=2"></script>
  <script src="js/main.js?v=9"></script>
</body>
</html>
